version: "3.9"

services:
  # ═══════════════════════════════════════════
  # FIA Engagement Engine (Sofía)
  # Sidecar independiente: lee Supabase → Claude/Codex → WhatsApp (Evolution API)
  # ═══════════════════════════════════════════
  fia-engine:
    build:
      # CI copies engine source to /opt/dittofeed/fia-engine before running compose.
      # Don't change to ../packages/... — that path doesn't exist on the VPS.
      context: ./fia-engine
      dockerfile: Dockerfile
    image: fia-engagement-engine:latest
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /opt/dittofeed/fia-engine-data:/app/sessions
      # Mount Codex auth.json (uploaded via /admin/codex)
      - /opt/dittofeed/codex-auth:/root/.codex
    # Pass through ALL vars from /opt/dittofeed/.env so PILOT_PHONE,
    # CRON_*, WHATSAPP_FALLBACK_PROVIDER, etc. reach the container.
    env_file:
      - .env
    environment:
      # Defaults that apply only if .env doesn't set them
      - ENGINE_PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dittofeed-net

networks:
  # Internal bridge for the engine container. Name kept for VPS continuity
  # (matches the /opt/dittofeed deploy path); the engine does not use it for
  # inter-container traffic — it only talks to external services.
  dittofeed-net:
    driver: bridge
